name: Deploy Next.js to GitHub Pages

on:
  # Roda quando um push é feito na branch 'main'
  push:
    branches: [main]
  
  # Permite que você rode este workflow manualmente pela aba Actions do GitHub
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies 📦
        run: npm ci

      - name: Build 🏗️
        # Roda o comando de build do Next.js
        run: npm run build
        # Define a variável de ambiente para que o next.config.mjs use o 'basePath'
        env:
          NODE_ENV: production

      - name: Add .nojekyll file
        # Cria um arquivo .nojekyll para evitar problemas com o Jekyll do GitHub Pages
        run: touch ./out/.nojekyll
      
      - name: Deploy to GitHub Pages 🚀
        # Action popular que faz o deploy na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # O diretório que será publicado (o resultado do build)
          publish_dir: ./out